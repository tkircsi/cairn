syntax = "proto3";

package oci.v1;

option go_package = "github.com/tkircsi/cairn/gen/oci/v1;ociv1";

// StoreService is the write surface, in OCI vocabulary.
//
// Everything that mutates the store comes through here, so manifest parsing,
// digest verification and the blob-then-metadata ordering happen in exactly one
// place. The OCI HTTP surface is deliberately read-only: it exists so that oras,
// cosign, crane and regsync can read this store, not write into it.
//
// This is also why there is no upload-session RPC. A gRPC caller has the bytes
// in hand, so it does not need end-4a/5/6/13/14 (POST, PATCH, PUT, GET, DELETE
// against a blob-upload location) to hand them over.
service StoreService {
  rpc PutBlob(PutBlobRequest) returns (PutBlobResponse);
  rpc PutManifest(PutManifestRequest) returns (PutManifestResponse);
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);
  rpc DeleteManifest(DeleteManifestRequest) returns (DeleteManifestResponse);
  rpc ListReferrers(ListReferrersRequest) returns (ListReferrersResponse);
}

message PutBlobRequest {
  string repository = 1;
  bytes data = 2;
}

message PutBlobResponse {
  // Digest derived from the bytes. A caller-supplied digest is never trusted.
  string digest = 1;
  int64 size = 2;
}

message PutManifestRequest {
  string repository = 1;
  // Raw manifest JSON. mediaType, artifactType, subject and annotations are
  // read out of these bytes rather than passed alongside them, so the stored
  // metadata can never disagree with the stored content.
  bytes data = 2;
}

message PutManifestResponse {
  string digest = 1;
  // Set when the manifest carried a subject, mirroring the OCI-Subject header
  // that end-7a returns on the HTTP surface.
  string subject = 2;
}

message GetManifestRequest {
  string repository = 1;
  string digest = 2;
}

message GetManifestResponse {
  bytes data = 1;
  string media_type = 2;
}

message DeleteManifestRequest {
  string repository = 1;
  string digest = 2;
}

message DeleteManifestResponse {}

message ListReferrersRequest {
  string repository = 1;
  string subject = 2;
  // Optional filter, as in end-12b.
  string artifact_type = 3;
}

message ListReferrersResponse {
  // Marshalled OCI image index, byte-identical to what end-12a serves.
  bytes index = 1;
  bool artifact_type_filter_applied = 2;
}
